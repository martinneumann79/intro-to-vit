[project]
name = "intro-to-vit"
version = "0.1.0"
description = "Compare Vision Transformers with CNNs on CIFAR-10"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[project.scripts]
compare-models = "intro_to_vit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intro_to_vit"]
